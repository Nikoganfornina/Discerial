spring:
  application:
    name: discerial-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/discerial}
    username: ${SPRING_DATASOURCE_USERNAME:discerial}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
